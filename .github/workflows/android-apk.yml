name: Android APK

# The ONLY supported APK build path for this project (see docs/TESTING.md).
# Local Gradle/Android builds are intentionally not used.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'supabase/**'
      - 'tool/**'
      - 'analysis_options.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          java -version

      # gradlew / gradlew.bat / gradle-wrapper.jar are git-ignored on purpose
      # (binary blobs). They are copied from the Flutter template instead of
      # being committed, so no download scripts or large artifacts are stored.
      - name: Prepare Gradle wrapper
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.bestiecourt \
            --project-name roast_my_bestie /tmp/flutter_scaffold > /dev/null
          cp /tmp/flutter_scaffold/android/gradlew android/gradlew
          cp /tmp/flutter_scaffold/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/flutter_scaffold/android/gradle/wrapper/gradle-wrapper.jar \
             android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          ls -l android/gradlew android/gradle/wrapper/gradle-wrapper.jar

      - name: Resolve dependencies
        run: flutter pub get

      # Report-only: the AI workspace has no Dart SDK, so formatting is
      # surfaced instead of blocking. Run `dart format lib test` locally
      # once and commit the result to make this step clean.
      - name: Format check (report-only)
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed lib test \
            || echo '::warning::Formatting differences found.'

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test --reporter compact

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=1.0.0 --build-number="${GITHUB_RUN_NUMBER}"

      - name: Report APK
        if: success()
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "APK: build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roast-my-bestie-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sql-check:
    name: Validate SQL migrations + RLS smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: bestie
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A vanilla PostgreSQL has no Supabase `auth` schema. These shims let the
      # real migration + seed run unmodified, then the smoke test exercises the
      # RPCs as the least-privileged `authenticated` role.
      - name: Stub the Supabase auth schema and roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb not null default '{}'::jsonb
          );
          create or replace function auth.uid()
          returns uuid language sql stable as $fn$
            select nullif(
              current_setting('request.jwt.claim.sub', true), ''
            )::uuid
          $fn$;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL

      - name: Apply migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "::group::applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Apply seed
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Run RLS / business-rule smoke test
        run: psql -v ON_ERROR_STOP=1 -f tool/sql_smoke_test.sql
