name: roast_my_bestie
description: "Roast My Bestie - Funny, consent-based multiplayer social game for friends."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  flutter_local_notifications: ^17.2.1
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stickers/
    - assets/animations/
